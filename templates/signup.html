<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Organization Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dxb-style.css" />
</head>
<body>
<!-- Background Video --> 
<div class="container py-3 login-section">
  <div class="row g-0">
    <!-- Left: Welcome Panel -->
    <div class="col-lg-8 col-md-6 col-sm-12 side-panel d-flex flex-column justify-content-center align-items-center rounded">
        <img src="https://www.dxbnewsnetwork.com/upload/logo/dxb_black.png" alt="Logo" class="login-logo">
      <h2 class="fw-bold">Welcome to our community</h2>
      <p class="mb-2">Personalized, updated daily, and beautifully presented.</p>
      <p class="mb-3">Sign in to find your dream ways of earning and gain full access to platform functions.</p>
    </div>
    <!-- Right: Login Form -->
    <div class="col-lg-4 col-md-6 col-sm-12 d-flex align-items-center bg-white rounded">
      <div class="form-box">
        <h2 class="fw-bold">Create an Account</h2>
        <p class="text-muted">Register your organization to get started.</p>

        <form>
          <div class="row g-2">
              <div class=" mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="Name" required />
              </div>
              <div class=" mb-3">
                <input type="email" class="form-control form-control-lg" placeholder="Email" required />
              </div>
              <div class=" mb-3">
                <input type="password" class="form-control form-control-lg" placeholder="Password" required />
              </div>
             
              <div class="mb-3">
                <input type="password" class="form-control form-control-lg" placeholder="Confirm Password" required />
              </div>
              <div class=" mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="Phone Number" />
              </div>
             

          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-dxbnews btn-lg">Sign Up</button>
          </div>
          <div class="text-center mt-3">
              <small>Already have an account? <a href="login.html">Login</a></small>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
