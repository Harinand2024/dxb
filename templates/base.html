{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght
    @100;200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font
    -awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdY
    TDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHU
    SCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://kit.fontawesome.com/c451d80140.js" crossorigin="
    anonymous"></script>
    <title>Facebook Profile Page</title>
    <style>
        #previewContainer {
            display: none;
            margin-top: 10px;
        }
        #previewImage {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .posted-content {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .fixed-post-img {
            width: 100%;          /* Full container width */
            max-width: 500px;     /* Optional max width */
            height: 300px;        /* Fixed height */
            object-fit:fill;    /* Ensures image is cropped nicely */
            border-radius: 10px;  /* Optional rounded corners */
            margin-top: 10px;
        }

        .cover-wrapper {
        position: relative;
        display: inline-block;
        }

        .cover {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        }

        .edit-icon {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            width: 40px;
            height: 40px;
        }

        .edit-icon:hover {
        background: #f0f0f0;
        }
        .textarea{
            width: 100%;
            margin: 10px 0px;
            border: 1px solid #ddd;
            padding: 10px;
        }
    


    </style>
</head>
<body>
            
    <nav>
        <div class="nav_left">
            
            <a href="{% url 'home' %}">
                <img src="{% static 'images/logo.png' %}" alt="Logo" />

            </a>
            <ul>
                <li><img src="{% static 'images/notification.png' %}" alt="notification"></li>
                <li><img src="{% static 'images/inbox.png' %}" alt="inbox"></li>
                <li><img src="{% static 'images/video.png' %}" alt="video"></li>
            </ul>
        </div>
        <div class="nav_right">
            <div class="search_box">
                <img src="{% static 'images/search.png'%}" alt="search">
                <input type="search" placeholder="Search">
            </div>
            <div class="nav_user_icon online_icon" onclick="settingsMenuToggle()">
                <img src="http://127.0.0.1:8001{{ profile.profile_picture }}" alt="profile">
            </div>
        </div>
        
        <div class="setting_menu">
            
            <div id="dark_btn" class="dark_btn_on">
                <span></span>
            </div>

            <div class="settings_menu_inner">
                <div class="user_profile">
                    <img src="http://127.0.0.1:8001{{ profile.profile_picture }}" alt="Pro We Are Pro You Now">
                    <div>
                        <p>{{ profile.username }}</p>
                        <a href="{% url 'dashboard' %}">See Your Profile</a>
                    </div>
                </div>
                <hr />
                <div class="user_profile">
                    <img src="{% static 'images/feedback.png' %}" alt="">
                    <div>
                        <p>Give Feedback</p>
                        <a href="#">Help Us To improve  new design</a>
                    </div>
                </div>
                <hr />
                <div class="setting_link">
                    <img src="{% static 'images/setting.png'%}" class="setting_icon" alt="">
                    <a href="#">Setting & Privacy <img src="{% static 'images/arrow.png' %}" alt="" width="10px"></a>
                </div>
                <div class="setting_link">
                    <img src="{% static 'images/help.png''%}" class="setting_icon" alt="">
                    <a href="#">Help & Support <img src="{% static 'images/arrow.png' %} " alt="" width="10px"></a>
                </div>
                <div class="setting_link">
                    <img src="{% static 'images/display.png'%}" class="setting_icon" alt="">
                    <a href="#">Dispaly & Accesiblity <img src="{% static 'images/arrow.png'%}" alt="" width="10px"></a>
                </div>
                <div class="setting_link">
                    <img src="{% static 'images/logout.png'%}" class="setting_icon" alt="">
                    <a href="{% url 'logout' %}">Logout<img src="{% static 'images/arrow.png'%}" alt="" width="10px"></a>
                </div>
            </div>
        </div>
    </nav>
    {% block content %}

    {% endblock %}

<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
