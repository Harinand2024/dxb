<div class="profile_intro">
  <div class="title_box d-flex justify-content-between align-items-center mb-2">
    <h3>Photos</h3>
    <a href="">All Photos</a>
  </div>
  <div class="photo_box d-flex flex-wrap gap-2">
    {% for photo in profile.photos|slice:":6" %}
    <div><img src="{{ photo.url }}" alt="Photo"></div>
    {% endfor %}
  </div>
</div>
