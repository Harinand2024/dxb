{% load static %}
<div id="introContainer">
  <div class="profile_intro border rounded p-3 mb-3">
    <h3 contenteditable="true" class="mb-3">
      <i class="fas fa-user-edit edit-icon me-2"></i> Intro
    </h3>
    <p class="intro_text mb-3">
      <span contenteditable="true">
        {{ profile.bio|default:"Add your intro here…" }}
      </span>
      <img src="{% static 'images/feeling.png' %}" alt="Feeling Icon" />
    </p>
    <hr>
    <ul class="introFieldsList list-unstyled">
      {% for field in profile.intro_fields %}
      <li class="d-flex align-items-center mb-2">
        <img src="{% static field.icon %}" class="me-2">
        <span contenteditable="true" class="flex-grow-1">{{ field.text }}</span>
        <button class="btn btn-sm ms-2" onclick="removeIntroField(this)" title="Delete">
          <i class="fas fa-trash-alt"></i>
        </button>
      </li>
      {% endfor %}
    </ul>
    <div class="d-flex mt-3">
      <input type="text" class="form-control me-2 newFieldInput" placeholder="Add custom intro line...">
      <button class="btn btn-outline-primary-art" onclick="addIntroField(this)" title="Add Field">
        <i class="fas fa-plus-circle"></i>
      </button>
    </div>
  </div>
</div>
