<!-- Crop Cover Photo Modal -->
<div class="modal fade" id="coverCropModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crop Cover Photo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <img id="coverCropImage" class="img-fluid" style="max-width: 100%;">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="cropImage('cover')">Crop & Save</button>
      </div>
    </div>
  </div>
</div>
