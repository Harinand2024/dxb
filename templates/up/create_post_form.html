{% load static %}
<link rel="stylesheet" href="{% static 'style2.css' %}">

<style>
    :focus-visible {
        outline: none !important;
    }
    .cover-wrapper {
      position: relative;
      display: inline-block;
    }

    .cover {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
    }

    .edit-icon-top {
         position: absolute;
        bottom: 30px;
        right: 10px;
        background: white;
        padding: 10px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        width: 40px;
        height: 40px;
        font-size: 16px;
    }

    .edit-icon-top:hover {
      background: #f0f0f0;
    }
    .textarea{
        width: 100%;
        margin: 10px 0px;
        border: 1px solid #ddd;
        padding: 10px;
    }
    .editable:hover {
        cursor: pointer;
        background-color: #f0f0f0;
    }
    .edit-icon {
        float: right;
        cursor: pointer;
        color: gray;
        font-size: 16px;
        margin-top: 8px;
    }
    .edit-icon:hover {
        color: black;
    }
    .introFieldsList{
        padding: 0px;
    }
    .profile-detail-actions .btn {
    font-weight: 500;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 8px;
    background-color: #f0f2f5;
    border: none;
    transition: background-color 0.3s;
    }

    .profile-detail-actions .btn:hover {
    background-color: #e4e6eb;
    }
.pd_image {
  width: 100px !important;
  height: 100px !important;
  object-fit: cover;
  border-radius: 6px !important;
  display: block;
}

.profile-img-wrapper {
  position: relative;
  display: inline-block;
}

.camera-icon {
      position: absolute;
    bottom: 3px;
    right: 21px;
    background-color: #f0f2f5;
    border: 2px solid white;
    border-radius: 50%;
    padding: 4px 5px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    transition: background-color 0.2s;
    width: 30px;
    height: 30px;
}

.camera-icon:hover {
  background-color: #e4e6eb;
}
.post_input_container {
    background: #fff;
    border-radius: 5px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
}

/* Style the textarea */
.post_input_container .textarea {
    width: 100%;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 12px;
    resize: vertical;
    font-size: 14px;
}

/* Input fields */
.post_input_container .form-control {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
}

/* Submit button */
.post_input_container .btn {
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    padding: 10px 16px;
}

/* Post action icons section */
.add_post_link {
    border-top: 1px solid #eee;
    padding-top: 12px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.add_post_link a {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #555;
    font-size: 14px;
    transition: background 0.2s;
    padding: 6px 10px;
    border-radius: 8px;
}

.add_post_link a:hover {
    background-color: #f0f2f5;
}

.add_post_link img {
    width: 20px;
    height: 20px;
    margin-right: 8px;
}



</style>
<div class="post_container mb-3">
  <div class="user_profile d-flex align-items-center mb-2">
    <img src="http://127.0.0.1:8001{{ profile.profile_picture }}" alt="Profile" class="pd_image me-2">
    <div>
      <p>{{ request.user.username }}</p>
      <small>Public <i class="fa fa-caret-down"></i></small>
    </div>
  </div>
  <div class="post_input_container">
    <form method="POST" action="{% url 'create_post' %}" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="hidden" name="profile_id" value="{{ profile.id }}">
      <textarea name="content" class="textarea mb-2" placeholder="What's on your mind?" rows="3" required></textarea>
      <input type="text" name="title" placeholder="Title (optional)" class="form-control mb-2">
      <input type="text" name="caption" placeholder="Caption (optional)" class="form-control mb-2">
      <input type="file" name="media_files" multiple class="form-control mb-2">
      <button type="submit" class="btn btn-primary">Post</button>
    </form>
    <div class="add_post_link mt-2 d-flex gap-3">
      <a><img src="{% static 'images/live-video.png' %}"> Live Video</a>
      <a><img src="{% static 'images/photo.png' %}"> Photo/Video</a>
      <a><img src="{% static 'images/feeling.png' %}"> Feeling/Activity</a>
    </div>
  </div>
</div>
