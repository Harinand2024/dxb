{% extends 'base2.html' %}
{% load static %}

{% block body %}
<div class="container mt-5">
  <h2 class="mb-4">Photo Gallery</h2>
  <div class="row">
    {% for photo in photos %}
    <div class="col-6 col-md-4 col-lg-3 mb-4">
      <img src="{{ photo }}" class="img-fluid rounded shadow-sm" style="object-fit: cover; height: 200px; width: 100%;" alt="Photo">
    </div>
    {% endfor %}
  </div>
  {% if not photos %}
  <p class="text-muted">No photos available.</p>
  {% endif %}
</div>
{% endblock %}
